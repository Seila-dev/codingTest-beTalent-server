version: '3.8'

services: 
  teste-tecnico:
    image: postgres:15
    container_name: teste-tecnico
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: database
    ports:
      - "26257:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data